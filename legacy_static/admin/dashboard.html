<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>
<body>

<div class="container">

<div class="header">

    <h1>🌿 Devora Naturals Admin</h1>

    <button>Logout</button>

</div>
<div class="cards">

    <div class="card">
        <h3>Total Products</h3>
        <p id="productCount">0</p>
    </div>

    <div class="card">
        <h3>Categories</h3>
        <p>3</p>
    </div>

    <div class="card">
        <h3>Status</h3>
        <p>Online</p>
    </div>

</div>

<div class="form-box">

<h2>Add Product</h2>

<div class="form-grid">

<input type="text" id="productName" placeholder="Product Name">
<input type="number" id="productPrice" placeholder="Price">
<input type="text" id="productCategory" placeholder="Category">
<textarea id="productDescription" placeholder="Description"></textarea>


<input
    type="text"
    id="productImage"
    placeholder="Image URL">


</div>

<div class="buttons">

<button id="saveBtn">Add Product</button>

<button id="updateBtn" style="display:none;">
    update Product
    </button>

</div>

</div>

<div class="table-box">

    <h2>📦 Product List</h2>

    <input
            type="text"
            id="searchBox"
            placeholder="🔍 Search products...">

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Category</th>
                <th>Description</th>
                <th>Image</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody id="productTable">

        

    </tbody>

    </table>

</div> <!-- End of table-box -->

</div> <!-- End of container -->

<script type="module" src="../js/admin.js"></script>

</body>
</html>
